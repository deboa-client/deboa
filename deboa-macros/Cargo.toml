[package]
name = "deboa-macros"
version = "0.1.0-beta.12"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Request macros for the deboa HTTP client"
readme = "README.md"
license.workspace = true
keywords = ["compiler-plugin", "macros"]
publish = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)']}

[package.metadata.cargo-machete]
ignored = ["deboa-extras"]

[lib]
proc-macro = true

[features]
default = [
  "json",
]
json = ["deboa-extras/json"]
xml = ["deboa-extras/xml"]
msgpack = ["deboa-extras/msgpack"]

[dependencies]
deboa = { workspace = true }
deboa-extras = { workspace = true, optional = true }
http = { workspace = true }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.5"

[dev-dependencies]
deboa-tokio.workspace = true
tokio.workspace = true
trybuild = "1.0.120"
