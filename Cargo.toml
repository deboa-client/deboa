[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
    "deboa",
    "deboa-macros",
]

[workspace.package]
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa"
homepage = "https://github.com/ararog/deboa"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"

[workspace.dependencies]
async-executor = { version = "1.13.3", default-features = false }
async-lock = "3.4.2"
base64 = { version = "0.23.0" }
bytes = { version = "1.11" }
caramelo = "0.1.4"
cookie = { version = "0.18.1" }
deboa = { path = "deboa", version = "0.1.5-beta.1" }
#deboa-extras = { path = "../deboa-contrib/deboa-extras" }
deboa-extras = "0.1.1-beta.2"
hashbrown = "0.17.1"
http = "1"
hyper = { version = "1.11.1", features = ["client"], default-features = false }
hyper-body-utils = { version = "0.1.17", default-features = false }
hyper-util = { version = "0.1.20", features = [
  "client",
  "client-legacy",
], default-features = false }
multer = "3.1.0"
rstest = "0.27.0"
serde = { version = "1.0.217", features = ["derive"] }
tackle = { version = "0.1.1" }

[profile.test]
lto = false

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
