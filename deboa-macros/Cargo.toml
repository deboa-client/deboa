[package]
name = "deboa-macros"
version = "0.1.0-beta.7"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Request macros for the deboa HTTP client"
readme = "README.md"
license.workspace = true
keywords = ["compiler-plugin", "macros"]
publish = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
default = [
  "json",
]
json = ["deboa-extras/json"]
xml = ["deboa-extras/xml"]
msgpack = ["deboa-extras/msgpack"]

[dependencies]
deboa = { workspace = true, default-features = false }
deboa-extras = { workspace = true, default-features = false, optional = true }
http = { workspace = true }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde =  { workspace = true }
syn = "3.0.5"

[dev-dependencies]
trybuild = "1.0.120"
