[package]
name = "deboa"
version = "0.1.5-beta.7"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-ws"
homepage = "https://github.com/ararog/deboa"
description = "A friendly rest client on top of hyper."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true

[features]
default = []

cookie = ["dep:cookie"]

[dependencies]
async-lock.workspace = true
base64.workspace = true
bytes.workspace = true
cookie = { workspace = true, optional = true }
hashbrown.workspace = true
http.workspace = true
http-body-util = "0.1"
hyper = { workspace = true, features = ["client", "http1", "http2"], default-features = false }
hyper-body-utils = { workspace = true, default-features = false }
log = "0.4.33"
regex = { version = "1.12.4", default-features = false }
serde = { workspace = true }
tackle = { workspace = true }
thiserror = "2.0.17"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
caramelo.workspace = true
criterion = { version = "0.8.2", features = [
  "html_reports",
  "async",
  "async_smol",
  "async_tokio",
] }
mime = { version = "0.3.17" }
multer.workspace = true
time = { version = "0.3.53" }
tokio-util = "0.7.19"
tokio.workspace = true
